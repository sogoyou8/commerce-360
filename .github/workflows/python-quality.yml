name: Commerce 360 / Python quality

on:
  push:
    branches:
      - main
      - feature/e3-analyses-sql
      - feature/e5-segmentation-rfm
      - feature/e6-powerbi
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  tests:
    name: E2–E6 offline contracts
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Python unittest suite
        run: python -m unittest discover -s tests -v
